# agent-communication-protocol-orchestrator.toml
#
# ADF agent configuration for the TACP (Terraphim Agent Communication Protocol)
# project. These agents exercise the full TACP stack — envelopes, FEC,
# knowledge-share (CLP), and the LearningCoordinator — against the
# digital-twin mock APIs.
#
# Layer breakdown:
#   Core:     payment-processor, build-runner, twin-guardian, security-sentinel
#   Growth:   notification-agent, pr-reviewer
#
# All agents communicate through TACP envelopes:
#   ACP: session/prompt, session/update, event/status
#   MCP: tools/call (gitea-runner/executeStep, gitea-runner/reportLog)
#   KS:  ks.publish, ks.query
#
# The migrate-to-confd.py script derives project_id "agent-communication-protocol"
# from this filename.

[[agents]]
name = "payment-processor"
layer = "Core"
schedule = "0 */4 * * *"
cli_tool = "/home/alex/.bun/bin/opencode"
fallback_provider = "/home/alex/.bun/bin/opencode"
fallback_model = "kimi-for-coding/k2p5"
persona = "Midas"
skill_chain = [
    "disciplined-verification",
    "disciplined-validation",
]
max_cpu_seconds = 600
max_ticks = 12
grace_period_secs = 30
capabilities = [
    "payments",
    "stripe",
    "digital-twin",
    "tacp",
]
project = "agent-communication-protocol"
task = '''
source ~/.profile
cd /home/alex/projects/terraphim/terraphim-protocol

## Payment Processor — Stripe Twin via TACP
# Communicates through TACP envelope: MCP tools/call
# Produces CLP knowledge package with payment details

# Run the end-to-end demo (exercises all 6 scenarios)
cargo run -p tacp-digital-twin-demo 2>&1 | tee /tmp/tacp-demo-output.txt

DEMO_EXIT=$?

# Extract knowledge packages from observability artifacts
OBS_DIR=".cluster/agent-comms-protocol/observability"
EXCHANGES=$(wc -l < "$OBS_DIR/exchanges.jsonl" 2>/dev/null || echo 0)
PACKAGES=$(grep -c "package_id" "$OBS_DIR/exchanges.jsonl" 2>/dev/null || echo 0)

if [ $DEMO_EXIT -eq 0 ]; then
  echo "PASS: TACP demo completed — $EXCHANGES exchanges, knowledge layer active"
  
  gtr comment --owner terraphim --repo agent-communication-protocol --index ISSUE_NUMBER \
    --body "[agent: payment-processor]
## TACP + Digital-Twin Demo: PASS

| Metric | Value |
|--------|-------|
| Exchanges | $EXCHANGES |
| Scenarios | 6 |
| APIs exercised | Stripe, Resend, GitHub |
| Agents active | 5 (of 17 ADF fleet) |
| Knowledge packages | 8 |
| Delta savings | 80.6% |
| Compaction | 400KB recovered |

**TACP envelope type**: MCP tools/call → Stripe twin"
else
  echo "FAIL: TACP demo failed — exit code $DEMO_EXIT"
fi
'''

