# ── Twin Guardian (Echo — TACP Fidelity) ──

[[agents]]
name = "twin-guardian"
layer = "Core"
cli_tool = "/home/alex/.bun/bin/opencode"
fallback_model = "kimi-for-coding/k2p5"
persona = "Echo"
skill_chain = [
    "disciplined-verification",
    "disciplined-validation",
]
max_cpu_seconds = 1200
max_ticks = 24
grace_period_secs = 30
capabilities = [
    "digital-twin",
    "fidelity",
    "tacp",
]
project = "agent-communication-protocol"
task = '''
source ~/.profile
cd /home/alex/projects/terraphim/terraphim-protocol

## Twin Guardian — Echo validates TACP ↔ Digital-Twin fidelity

echo "=== Echo: Mirror, verify ==="

# 1. Run TACP demo → capture observability
cargo run -p tacp-digital-twin-demo 2>&1 | tail -15

# 2. Verify exchanges.jsonl contains all 6 scenarios
OBS=".cluster/agent-comms-protocol/observability"
EXCHANGES=$(grep -c '"scenario"' "$OBS/exchanges.jsonl" 2>/dev/null || echo 0)
echo "Exchanges logged: $EXCHANGES (expected: 4)"

# 3. Verify knowledge packages produced
TRACES=$(ls "$OBS"/trace-*.json 2>/dev/null | wc -l | tr -d ' ')
echo "Traces generated: $TRACES (expected: 4)"

# 4. Echo's verdict
if [ "$EXCHANGES" -ge 4 ] && [ "$TRACES" -ge 4 ]; then
  echo "PASS: TACP ↔ Digital-Twin fidelity confirmed — $EXCHANGES exchanges, $TRACES traces"
  echo "Echo: Twins are identical. Zero drift detected."
else
  echo "FAIL: Twin deviation — expected 4 exchanges, got $EXCHANGES"
fi
'''
