task = '''
source ~/.profile
cd /home/alex/projects/zestic-ai/digital-twins

echo "[disciplined-specification] Writing fidelity contract for conversations.open"

cat > /tmp/conversations-open-spec.md << 'SPEC'
# Fidelity Contract: Slack conversations.open

## Vendor API Contract
- POST https://slack.com/api/conversations.open
- Content-Type: application/x-www-form-urlencoded
- Auth: Bearer token (xoxb- prefix)

## Request
| Field | Type | Required | Description |
|-------|------|----------|-------------|
| users | string | yes | Comma-separated user IDs (up to 8) |
| return_im | boolean | no | Return IM channel object |

## Response (success)
```json
{"ok":true,"channel":{"id":"D...","created":1234567890,"user":"U..."}}
```

## Response (errors)
| Code | Condition |
|------|-----------|
| user_not_found | User does not exist |
| user_disabled | User account disabled |
| user_restricted | User restricted |
| not_authed | Missing/invalid token |

## Determinism Requirement
Same user set → same channel ID (hash-based, not random).

## Twin Implementation Contract
1. POST /api/conversations.open accepts form-encoded users param
2. Channel ID derived from MD5(users_sorted)
3. Channel stored in SlackChannelStore and returned on subsequent calls
4. Unknown users return user_not_found error
5. Auth validated via twin-slack auth middleware
SPEC

echo "Fidelity contract written: /tmp/conversations-open-spec.md"
wc -l /tmp/conversations-open-spec.md

gtr comment --owner terraphim --repo digital-twins --index ${ISSUE_NUMBER:-149} \
  --body "[agent: disciplined-specification]
## Fidelity Contract: conversations.open

Written. 5 requirements, 4 error codes, deterministic hash-based channel ID.

**TACP envelope**: acp.session.prompt → specification phase complete
**Deliverable**: fidelity-contract.md"
'''

