# digital-twins-orchestrator.toml
#
# Orchestrator configuration for the digital-twin project (zestic-ai/digital-twins).
# Manages a fleet of 5 agents that validate and maintain the digital-twin API mocks
# (Stripe, Resend, GitHub OAuth, Google OAuth, Zoho CRM, Linear).
#
# Layer breakdown:
#   Core:     payment-processor, twin-guardian, security-sentinel,
#            disciplined-research, disciplined-specification,
#            disciplined-implementation, disciplined-pr-review,
#            disciplined-quality-evaluation
#   Growth:   notification-agent, pr-reviewer
#
# The migrate-to-confd.py script derives project_id "digital-twins" from
# this filename automatically.

[[agents]]
name = "payment-processor"
layer = "Core"
schedule = "0 */4 * * *"  # Every 4 hours
cli_tool = "/home/alex/.bun/bin/opencode"
fallback_provider = "/home/alex/.bun/bin/opencode"
fallback_model = "kimi-for-coding/k2p5"
persona = "Midas"
skill_chain = [
    "disciplined-verification",
    "disciplined-validation",
]
max_cpu_seconds = 600
max_ticks = 12
grace_period_secs = 30
capabilities = [
    "payments",
    "stripe",
    "digital-twin",
    "financial",
]
project = "digital-twins"
task = '''
source ~/.profile

## Payment Processor — Stripe Twin Validation

cd /home/alex/projects/zestic-ai/digital-twins

### 1. Verify twin server is running
curl -sf http://localhost:3001/_admin/health | jq . || {
    echo "Twin server not reachable — starting"
    cargo run -p twin-server -- --port 3001 &
    sleep 3
}

### 2. Create test payment intent via twin Stripe
PAYMENT_RESPONSE=$(curl -sf -X POST http://localhost:3001/v1/payment_intents \
  -H "Content-Type: application/x-www-form-urlencoded" \
  -d "amount=2999&currency=usd" | jq -c .)
echo "Payment created: $PAYMENT_RESPONSE"

PAYMENT_ID=$(echo "$PAYMENT_RESPONSE" | jq -r .id)
STATUS=$(echo "$PAYMENT_RESPONSE" | jq -r .status)

### 3. Confirm payment
CONFIRM_RESPONSE=$(curl -sf -X POST "http://localhost:3001/v1/payment_intents/$PAYMENT_ID/confirm" | jq -c .)
CONFIRMED_STATUS=$(echo "$CONFIRM_RESPONSE" | jq -r .status)

### 4. Validate twin fidelity
# Compare against real Stripe API spec
if [ "$STATUS" = "requires_payment_method" ] && [ "$CONFIRMED_STATUS" = "succeeded" ]; then
  echo "PASS: Stripe twin payment lifecycle matches spec"
  VERDICT="PASS"
else
  echo "FAIL: Twin deviation detected — status=$STATUS, confirmed=$CONFIRMED_STATUS"
  VERDICT="FAIL"
fi

### 5. Post result as knowledge package
gtr comment --owner zestic-ai --repo digital-twins --index ISSUE_NUMBER \
  --body "[agent: payment-processor]
## Stripe Twin Validation: $VERDICT

| Check | Expected | Actual | Status |
|-------|----------|--------|--------|
| Payment intent creation | requires_payment_method | $STATUS | ✓ |
| Payment confirmation | succeeded | $CONFIRMED_STATUS | ✓ |

**Twin fidelity**: $VERDICT
**Payment ID**: $PAYMENT_ID"

if [ "$VERDICT" = "FAIL" ]; then
  # Escalate to twin-guardian
  gtr comment --owner zestic-ai --repo digital-twins --index ISSUE_NUMBER \
    --body "@adf:twin-guardian twin drift detected on Stripe payment lifecycle — please investigate"
fi
'''

