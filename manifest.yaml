proposed_agents:
  build-runner:
    dispatch: push-or-pr-event
    policy: event-only
    template: scripts/adf-setup/agents/build-runner.toml
  pr-reviewer:
    dispatch: pr-event
    policy: event-only
    template: scripts/adf-setup/agents/pr-reviewer.toml
  merge-coordinator:
    dispatch: pr-event-or-comment
    policy: production-code-pairing
    template: scripts/adf-setup/agents/merge-coordinator.toml
  repo-steward:
    dispatch: scheduled
    policy: human-review-only
    template: scripts/adf-setup/agents/repo-steward.toml
  runtime-guardian:
    dispatch: scheduled-or-event
    policy: production-code-pairing
    template: scripts/adf-setup/agents/runtime-guardian.toml
  registry-steward:
    dispatch: scheduled-or-manual
    policy: human-review-only
    template: scripts/adf-setup/disabled-agents/registry-steward.toml
  gitea-runner-steward:
    dispatch: scheduled-or-manual
    policy: production-code-pairing
    template: scripts/adf-setup/disabled-agents/gitea-runner-steward.toml
  product-development:
    dispatch: scheduled
    policy: human-review-only
    template: scripts/adf-setup/agents/product-development.toml
