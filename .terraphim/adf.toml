# ============================================================================
# terraphim-ai — Repo-local full OrchestratorConfig (fleet standard)
# ============================================================================
# Conforms to private/cto-executive-system 2026-08-14-adf-agent-fleet-enablement.md:
#   - no `schedule = "on_demand"` (Growth/Safety agents OMIT schedule entirely)
#   - cli_tool is never plain `pi` (pi-rust symlink for coding agents)
#   - models: kimi-for-coding/k3, minimax-coding-plan/MiniMax-M3,
#     zai-coding-plan/glm-5.2 only (k2p5 and M2.5 are sunset)
#   - relative paths only (working dirs relative to repo root)
#   - tokens via ${GITEA_TOKEN} env-ref, never literals
# Refs terraphim/terraphim-ai#3234

project_id = "terraphim-ai"
name = "Terraphim AI"
working_dir = "."
tick_interval_secs = 30
disk_usage_threshold = 90
flow_state_dir = ".terraphim/flow-states"
max_restart_count = 3
restart_cooldown_secs = 300

[nightwatch]
eval_interval_secs = 300
active_start_hour = 2
active_end_hour = 6

# ── Scheduled disciplined-engineering cycle ──
[compound_review]
schedule = "0 6 * * *"
repo_path = "."
max_duration_secs = 1800
create_prs = false
worktree_root = ".worktrees"
auto_file_issues = false
auto_remediate = false

[direct_dispatch]
socket_path = "/tmp/adf-ctl-terraphim-ai.sock"

# ── PR-open gate producers (per-project schema: array-of-tables) ──
[[pr_dispatch]]
name = "pr-reviewer"
context = "adf/pr-reviewer"

[[pr_dispatch]]
name = "pr-validator"
context = "adf/validation"

[[pr_dispatch]]
name = "pr-verifier"
context = "adf/verification"

# ── Auto-merge gate ──
[auto_merge]
max_remediation_attempts = 3
max_dispatches_per_tick = 2
min_confidence = 5

# ============================================================================
# Project
# ============================================================================
[[projects]]
id = "terraphim-ai"
working_dir = "."

[projects.gitea]
base_url = "https://git.terraphim.cloud"
token = "${GITEA_TOKEN}"
owner = "terraphim"
repo = "terraphim-ai"

# ============================================================================
# Agents — fleet standard set (guide §3.5)
# ============================================================================

# ── Developer (pi-rust / kimi k3) — the code writer ──
[[agents]]
name = "developer"
layer = "Core"
cli_tool = "/usr/local/bin/pi-rust"
model = "kimi-for-coding/k3"
fallback_model = "zai-coding-plan/glm-5.2"
fallback_provider = "/usr/local/bin/pi-rust"
persona = "ferrox"
terraphim_role = "Terraphim AI Developer"
skill_chain = ["disciplined-research", "disciplined-design", "disciplined-implementation", "testing"]
capabilities = ["implementation", "rust-development", "tdd"]
project = "terraphim-ai"
schedule = "0 6 * * *"
task = '''
source ~/.profile

## Worktree Context
You are running in an isolated git worktree. Your CWD is the repo root.
Configure git identity before committing:
  git config user.email "adf-developer@terraphim.cloud"
  git config user.name "ADF Developer Agent"

## Session Checkpoint
1. git fetch origin 2>/dev/null
2. echo "=== Existing task branches ===" && git branch -r | grep "task/" || true
3. SKIP any issue where a remote branch or open PR already exists

## Pick Work
export GITEA_TOKEN="$(grep -o 'token = "[^"]*"' /opt/ai-dark-factory/conf.d/terraphim-ai.toml | head -1 | cut -d'"' -f2)"
export GITEA_URL="https://git.terraphim.cloud"
gtr ready --owner terraphim --repo terraphim-ai --extended

## Your Job
1. Pick the highest-priority unblocked issue from the ready list.
2. If no ready issues, report status and exit 0.
3. Claim it: gtr claim --owner terraphim --repo terraphim-ai --issue IDX --agent developer
4. Create a branch: git checkout -b task/IDX-short-title
5. Implement the fix following the issue spec (write REAL code, not placeholders).
6. Run cargo test --workspace and cargo clippy --workspace to verify.
7. Commit: git add -A && git commit --no-verify -m "[agent] feat: description. Refs terraphim/terraphim-ai#IDX"
8. Push: git push origin HEAD:refs/heads/task/IDX-short-title
9. Create PR: gtr create-pull --owner terraphim --repo terraphim-ai --title "Fix #IDX: title" --base main --head task/IDX-short-title
10. Comment: gtr comment --owner terraphim --repo terraphim-ai --index IDX --body "Implementation complete. @adf:reviewer please review PR."
11. DO NOT close the issue. The merge-coordinator closes after review.

## CRITICAL: SDK Validation Rule
BEFORE marking any implementation complete, you MUST validate against official SDKs:
1. ls tests/integration/*-sdk-test.mjs 2>/dev/null
2. Run the relevant SDK validation test: node tests/integration/<service>-sdk-test.mjs
3. If no SDK test exists for the modified service, create one using official SDK payload fixtures.
4. The SDK test MUST pass before you claim the work is complete.
5. Run cargo test --workspace AND the relevant SDK tests before creating PR.
DO NOT mark an implementation as complete unless SDK validation passes.
'''

