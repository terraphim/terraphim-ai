capabilities = ["code-review", "quality-gate", "review-coordination"]
project = "terraphim-ai"
schedule = "30 6 * * *"
task = '''
source ~/.profile

## Worktree: CWD is the repo root. git pull origin main

## Review the PR referenced in the mention context
1. Read the PR diff
2. Check for: correctness, security, performance, idiomatic code
3. Run tests if applicable
4. Post verdict as comment on the issue:
   - "compound-review verdict: GO" or "compound-review verdict: NO-GO"
