# ── Build runner (/bin/bash) — deterministic CI gate ──
[[agents]]
name = "build-runner"
layer = "Growth"
cli_tool = "/bin/bash"
capabilities = ["build", "test", "deterministic-ci"]
project = "terraphim-ai"
task = '''
source ~/.profile
export PATH=$HOME/.cargo/bin:$HOME/.local/bin:$HOME/bin:/usr/local/bin:/usr/bin:/bin:$PATH
export GITEA_URL=https://git.terraphim.cloud
export CARGO_INCREMENTAL=0

if [ -z "${ADF_PUSH_SHA:-}" ]; then echo "build-runner: missing ADF_PUSH_SHA" >&2; exit 1; fi
if [ -z "${ADF_PUSH_REF:-}" ]; then echo "build-runner: missing ADF_PUSH_REF" >&2; exit 1; fi

cd "$GITEA_WORKING_DIR"
git fetch origin "$ADF_PUSH_REF"
git checkout -f "$ADF_PUSH_SHA"

POST_STATUS() {
  curl -fsS -X POST -H "Authorization: token $GITEA_TOKEN" -H "Content-Type: application/json" -d "{\"state\":\"$1\",\"context\":\"adf/build\",\"description\":\"$2\"}" "$GITEA_URL/api/v1/repos/$GITEA_OWNER/$GITEA_REPO/statuses/$ADF_PUSH_SHA" >/dev/null 2>&1 || true
}
LOG="/tmp/adf-build-${GITEA_REPO}.log"; : > "$LOG"
POST_STATUS pending "build started"

run_step() { echo "=== $* ===" >>"$LOG"; "$@" >>"$LOG" 2>&1; }
ok=1
run_step cargo fmt --all -- --check || ok=0
run_step cargo clippy --workspace --all-targets -- -D warnings || ok=0
run_step cargo build --workspace || ok=0
run_step cargo test --workspace --all-targets --no-fail-fast || ok=0

if [ "$ok" -eq 1 ]; then
  POST_STATUS success "fmt+clippy+build+test pass"
else
  echo "--- build failed; tail ---"; tail -40 "$LOG"
  POST_STATUS failure "build failed; see $LOG"
  exit 1
fi
'''

