# cargo-deny configuration for cargo-deny 0.19.0+
# https://embarkstudios.github.io/cargo-deny/

[advisories]
db-path = "~/.cargo/advisory-dbs"
db-urls = ["https://github.com/RustSec/advisory-db"]
# unmaintained uses enum: "all", "workspace", "transitive", "none"
unmaintained = "workspace"
yanked = "warn"

# Ignore specific advisories
ignore = [
    # RSA Marvin Attack - transitive dep via octocrab -> jsonwebtoken -> rsa
    # No safe upgrade available yet; RustCrypto team migrating to constant-time impl
    # TODO: Remove once octocrab updates to rsa with constant-time support
    "RUSTSEC-2023-0071",
    # atty unaligned read - transitive dep, only affects Windows with custom allocators
    "RUSTSEC-2021-0145",
    # atty unmaintained - used by terraphim_agent, should migrate to std::io::IsTerminal
    # TODO: Replace atty with is-terminal or std::io::IsTerminal
    "RUSTSEC-2024-0375",
    # bincode unmaintained - used by redb persistence backend
    # TODO: Evaluate alternatives (postcard, rkyv, etc.)
    "RUSTSEC-2025-0141",
    # dotenv unmaintained - used by atlassian_haystack
    # TODO: Replace with dotenvy
    "RUSTSEC-2021-0141",
    # term_size unmaintained - transitive dep via terraphim_validation
    # TODO: Replace with terminal_size
    "RUSTSEC-2020-0163",
    # rustls-webpki CRL revocation bypass - transitive dep via serenity -> hyper-rustls -> rustls 0.21.x
    # serenity 0.12 pins hyper-rustls 0.24 which pins rustls 0.21; cannot override without serenity upgrade
    # Disabled by default: discord removed from tinyclaw default features
    # Default build uses patched rustls-webpki 0.103.12 (fixes 0049, 0098, 0099 on reqwest chain)
    # These only apply when --features discord is explicitly enabled
    # TODO: Remove once serenity 0.13+ releases with rustls 0.23+ support
    "RUSTSEC-2026-0049",
    # rustls-webpki name constraints bypass (URI) - same serenity -> rustls 0.22 -> webpki 0.102.x chain
    # Only affects builds with --features discord; default build uses patched 0.103.12
    "RUSTSEC-2026-0098",
    # rustls-webpki name constraints bypass (wildcards) - same serenity -> rustls 0.22 -> webpki 0.102.x chain
    # Only affects builds with --features discord; default build uses patched 0.103.12
    "RUSTSEC-2026-0099",
    # rand unsound with custom logger + thread_rng - currently transitive via proptest/dev tooling.
    # TODO: remove once the rand 0.9.3+ upgrade lands across the dependency graph.
    "RUSTSEC-2026-0097",
    # quick-xml 0.37.5 CVEs (RUSTSEC-2026-0194, RUSTSEC-2026-0195) — pinned by
    # the self_update git fork (terraphim_update branch
    # update-zipsign-api-v0.2) at ^0.37.5. Cannot upgrade without changing the
    # upstream dep. Both CVEs are upstream-only (adversarial XML parsing in
    # the self_update crate, which only parses release-manifest XML at binary
    # update time — not user-reachable from TinyClaw). Not introduced by this
    # session's work.
    # TODO: drop these ignores once self_update is upgraded to use quick-xml >= 0.41.
    "RUSTSEC-2026-0194",
    "RUSTSEC-2026-0195",
    # rmcp 0.9.1 — RUSTSEC-2026-0189 (DNS rebinding in Streamable HTTP
    # server transport). TinyClaw uses the stdio + child-process transports
    # only (see mcp/server.rs and mcp/client.rs); the vulnerable HTTP
    # transport is not exposed. The fix is to upgrade to rmcp >= 1.4.0,
    # which is a breaking API change (ServerInfo/Tool non-exhaustive struct
    # literals; peer_info now returns Arc<InitializeResult>). The upgrade
    # is a real Wave 2 refactor that is scoped separately.
    # TODO: remove once rmcp is upgraded to >= 1.4.0.
    "RUSTSEC-2026-0189",
]

[licenses]
version = 2
allow = [
    "MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause", "BSD-3-Clause", "ISC", "Zlib",
    "MPL-2.0", "CC0-1.0", "Unicode-3.0", "Unicode-DFS-2016",
    "BSL-1.0", "0BSD", "OpenSSL",
    "Unlicense",
    "GPL-3.0-or-later",
    "AGPL-3.0-or-later",
    "CDLA-Permissive-2.0",
    "bzip2-1.0.6",
    # Functional Source License 1.1 with MIT Future License.
    # Used by terraphim-llm-proxy. Non-OSI but explicitly accepted by
    # terraphim-ai per project policy (FSL converts to MIT after 2 years).
    "FSL-1.1-MIT",
]
confidence-threshold = 0.8

[[licenses.clarify]]
name = "ring"
expression = "MIT AND ISC AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

# Allow specific git sources for our forks and security patches
allow-git = [
    "https://github.com/terraphim/rust-genai.git",
    "https://github.com/AlexMikhalev/self_update.git",
    # Security patch: tokio-tungstenite v0.28.0 pulls in rustls 0.23+ avoiding RUSTSEC-2026-0049
    "https://github.com/snapview/tokio-tungstenite.git",
    # Security patch: rustls-webpki 0.103.10 to fix RUSTSEC-2026-0049 (used by newer rustls)
    "https://github.com/rustls/webpki.git",
    # terraphim-llm-proxy: main LLM proxy with intelligent routing.
    # Uses `claude_code_agents` git submodule (recursed with --recurse-submodules).
    "https://github.com/terraphim/terraphim-llm-proxy.git",
]
