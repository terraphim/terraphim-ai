[package]
name = "terraphim_lsp_core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors = ["Terraphim Team <team@terraphim.ai>"]
description = "Pure, WASM-buildable knowledge-graph analysis core for terraphim_lsp: KG term matches, synonym alternatives with capitalisation and a/an fix-up, and annotation-block exclusion"
documentation = "https://terraphim.ai"
homepage = "https://terraphim.ai"
repository = "https://github.com/terraphim/terraphim-ai"
keywords = ["lsp", "knowledge-graph", "wasm", "synonyms", "editor"]
categories = ["text-processing", "wasm"]
license = "Apache-2.0"
readme = "README.md"
# Consumed by terraphim-editor from the private registry (terraphim/terraphim-editor#13).
publish = ["terraphim"]

# Keep this crate free of tower-lsp, tokio and any I/O: it must build for
# wasm32-unknown-unknown. terraphim_automata's default feature set is empty;
# `default-features = false` keeps it that way if a default is ever added.
[dependencies]
terraphim_automata = { version = "2.1.0", registry = "terraphim", default-features = false }
terraphim_types = { version = "1.22.2", registry = "terraphim", default-features = false }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

# criterion pulls in rayon, which does not build for wasm32; native benches only.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
criterion = "0.8"

[[bench]]
name = "core_bench"
harness = false
