[package]
name = "terraphim_megahal_wasm"
version.workspace = true
edition.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "wasm-bindgen API and Trunk browser demo for terraphim_megahal (client-side Markov chatterbot, session-local learning)."
license.workspace = true
readme = "README.md"

[lib]
name = "terraphim_megahal_wasm"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
terraphim_megahal = { path = "../terraphim_megahal", features = ["personalities"] }
terraphim_sooth = { path = "../terraphim_sooth" }
wasm-bindgen = "0.2"
js-sys = "0.3"
console_error_panic_hook = "0.1"
serde = { workspace = true }
serde_json = { workspace = true }
# Seedable RNG injection (never OS entropy on the hot path, wasm32-safe).
rand_core = { version = "0.10", default-features = false }

[dependencies.web-sys]
version = "0.3"
features = [
    "Window",
    "Document",
    "Element",
    "Event",
    "EventTarget",
    "HtmlElement",
    "HtmlInputElement",
    "HtmlOptionElement",
    "HtmlOptionsCollection",
    "HtmlSelectElement",
    "HtmlTextAreaElement",
    "Storage",
    "Performance",
    "console",
    "KeyboardEvent",
]

[dev-dependencies]
wasm-bindgen-test = "0.3"
