[package]
name = "terraphim-linear-auth"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Linear API-key resolver for Terraphim crates. Loads from ~/.linearctl/config.json, $LINEAR_API_KEY, or `op read` (TTY-gated). Returns the key wrapped in a redaction-safe type."

[dependencies]
serde       = { workspace = true }
serde_json  = { workspace = true }
thiserror   = { workspace = true }
parking_lot = "0.12"

[dev-dependencies]
tempfile = { workspace = true }