[package]
name = "terraphim_tinyclaw"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Multi-channel AI assistant for Terraphim - Telegram, Discord, and CLI"
documentation = "https://terraphim.ai"
homepage = "https://terraphim.ai"
repository = "https://github.com/terraphim/terraphim-ai"
keywords = ["ai", "assistant", "telegram", "discord", "cli"]
license = "MIT OR Apache-2.0"
authors = ["Terraphim AI"]
readme = "../../README.md"

[[bin]]
name = "terraphim-tinyclaw"
path = "src/main.rs"

[dependencies]
# Async runtime
tokio = { workspace = true }
tokio-util = { version = "0.7", features = ["rt"] }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = "0.9"
toml = "0.8"

# HTTP client
reqwest = { workspace = true }
reqwest-eventsource = "0.6"

# Error handling
thiserror = { workspace = true }
anyhow = { workspace = true }

# Async traits
async-trait = { workspace = true }

# Time
chrono = { workspace = true }
uuid = { workspace = true }

# Logging
tracing = { workspace = true }

log = { workspace = true }
env_logger = "0.11"

# Environment
env_home = "0.1"
dirs = "5"

# Regex for ExecutionGuard
regex = "1"

# Concurrency
parking_lot = "0.12"

# CLI
clap = { version = "4", features = ["derive"] }

# Channel adapters (feature-gated)
teloxide = { version = "0.17", optional = true, features = ["macros"] }
serenity = { version = "0.12", optional = true }
slack-morphism = { version = "2", optional = true, features = ["hyper"] }
# Note: matrix-sdk disabled due to sqlite dependency conflict with terraphim_persistence
# Re-enable when matrix-sdk updates to rusqlite 0.32+ or when conflict resolved
# matrix-sdk = { version = "0.7", optional = true, default-features = false, features = ["native-tls"] }

# Voice transcription (optional)
whisper-rs = { version = "0.16", optional = true }
symphonia = { version = "0.5", optional = true, features = ["ogg", "pcm", "mp3", "wav"] }
hound = { version = "3.5", optional = true }

# MCP search engine. Powers `terraphim-tinyclaw skill search <query>`,
# which uses `mcp_search_skills` (Aho-Corasick over name + description + tags)
# to find saved skills by free-text query. Unconditional dep — the crate is
# tiny and search is a core skill-lifecycle operation. Published as v0.1.0
# to the terraphim registry (cargo publish --registry terraphim).
terraphim_mcp_search = { version = "0.1.0", registry = "terraphim" }

# MCP (Model Context Protocol) client + server for the 9-tool channel bridge
# (Wave 2 of Hermes parity arc). `server` + `transport-io` for stdio server;
# `client` + `transport-child-process` for stdio client.
rmcp = { version = "0.9.1", features = ["server", "transport-io", "client", "transport-child-process", "macros"] }
schemars = "1"

# Wave 3 of Hermes parity arc: cron scheduler with persistence.
# Uses `cron = "0.13"` for cron expression parsing (instead of a hand-rolled
# parser) and `terraphim_persistence` for job storage.
cron = "0.13"
terraphim_persistence = { version = "1.20.4" }

# Direct dep for opendal::ErrorKind matching in cron/store.rs.
# Was transitive via terraphim_persistence; made direct so the typed
# enum comparison is stable across opendal version bumps.
opendal = "0.54"

# Wave 5 (Phase C2) OpenAI-compatible HTTP proxy — TinyClaw provides its own
# minimal proxy here. Rather than depending on the sibling `terraphim-llm-proxy`
# crate (0.1.12) as a git dep (blocked: its `claude_code_agents` git submodule is
# registered in HEAD but missing from `.gitmodules`, so it is unfetchable from a
# fresh clone), TinyClaw forwards to the DEPLOYED proxy instance when
# `TERRAPHIM_LLM_PROXY_URL` is set (bigbox: http://100.106.66.7:3456,
# `PROXY_API_KEY` via `TERRAPHIM_LLM_PROXY_API_KEY`). Without the env var the
# proxy stays a hermetic echo stub so tests remain self-contained.
# See ADR-0010 for the full investigation notes (2026-08-08) and the deployed-
# leverage resolution (2026-08-11).

# Wave 4 (Phase B) Email channel — `haystack_jmap` from the terraphim
# registry (moved out of terraphim-private into the terraphim-service
# crates repo, #3198). Brings in `haystack_core` + `terraphim_types`
# from the same registry. Lib name is `haystack_jmap` (was `jmap_client`
# in the private copy); API: `JMAPClient::new(token, session_url)`,
# `search_emails(query, limit)`.
haystack_jmap = { version = "1.20.2", registry = "terraphim" }

# Wave 4 (Phase B) GitHub channel — HMAC-SHA256 webhook verification.
hmac = "0.12"
sha2 = "0.10"

# Wave 5 (Phase E) Hermes parity tools — sandbox, subagents, browser.
# terraphim_rlm: sandboxed execution (Local/Docker backends). Not a
# workspace member (firecracker-excluded) — path dep, minimal features:
# llm (LLM bridge), kg-validation (validator types), docker-backend.
# Sessions are in-memory (DashMap) so a CLI bridge cannot hold them;
# the crate must be called in-process (see research-tinyclaw-parity-tools).
terraphim_rlm = { path = "../terraphim_rlm", default-features = false, features = ["llm", "kg-validation", "docker-backend"] }
# terraphim_spawner: subagent pool + handles. Tiny standalone crate.
terraphim_spawner = { path = "../terraphim_spawner" }
# Provider/ProviderType/Capability types used by the subagent tool.
terraphim_types = { version = "1.20.2", registry = "terraphim" }

# Wave 5 (Phase C1) dashboard: axum-based HTTP server (Hermes parity).
axum = { version = "0.8", features = ["macros"] }
tower = "0.5"

[features]
default = ["telegram"]
telegram = ["dep:teloxide"]
discord = ["dep:serenity"]
slack = ["dep:slack-morphism"]
voice = ["dep:whisper-rs", "dep:symphonia", "dep:hound"]
# matrix = ["dep:matrix-sdk"]

[dev-dependencies]
tokio-test = "0.4"
tower = { version = "0.5", features = ["util"] }
reqwest = { workspace = true }
tempfile = { workspace = true }

criterion = { version = "0.8", features = ["async_tokio"] }

[[bench]]
name = "tinyclaw_benchmarks"
harness = false
