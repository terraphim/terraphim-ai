# TinyClaw Configuration for Telegram Bot
# Save as: ~/.config/terraphim/tinyclaw.toml
#
# NOTE: this matches the current config schema in `src/config.rs`.
# `Config { agent, llm, channels, ... }` requires `[llm.proxy]` and
# `[llm.direct]`; `TelegramConfig` accepts `token` + `allow_from`.

[agent]
# Workspace directory for temporary files
workspace = "/tmp/tinyclaw"

# LLM Configuration
[llm.proxy]
# Base URL for the terraphim-llm-proxy (tool-calling / quality responses)
base_url = "http://127.0.0.1:3456"
# API key for proxy authentication (empty warns, may fail)
api_key = ""
# Request timeout in milliseconds (default 60000)
timeout_ms = 60000
# Model override (optional - proxy decides if not set)
# model = "..."

[llm.direct]
# Direct LLM for cheap/local tasks (compression + simple QA)
provider = "ollama"
model = "llama3.2"
base_url = "http://127.0.0.1:11434"

# Telegram Channel Configuration
[channels.telegram]
# Bot token from @BotFather
# IMPORTANT: Use environment variable ${TELEGRAM_BOT_TOKEN}
token = "${TELEGRAM_BOT_TOKEN}"

# Allowed senders (user IDs or usernames). "*" allows everyone.
# Must be non-empty for security.
allow_from = ["*"]
