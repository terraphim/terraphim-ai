[package]
name = "terraphim_spawner"
version = "1.21.0"
edition = "2021"
rust-version.workspace = true
authors = ["Terraphim Team <team@terraphim.ai>"]
description = "Agent spawner for Terraphim with health checking and output capture"
documentation = "https://terraphim.ai"
homepage = "https://terraphim.ai"
repository = "https://github.com/terraphim/terraphim-ai"
keywords = ["ai", "agents", "spawner", "process-management", "health-check"]
license = "Apache-2.0"
readme = "../../README.md"

[dependencies]
terraphim_types = { version = "1.0.0", registry = "terraphim" }

tokio = { workspace = true, features = ["full"] }
thiserror = { workspace = true }
tracing = { workspace = true }
regex = "1.10"
nix = { version = "0.27", features = ["process", "signal", "resource", "fs"] }
libc = "0.2"

serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
uuid = { workspace = true, features = ["v4", "serde"] }
chrono = { workspace = true, features = ["serde"] }
sha2 = "0.10"

[dev-dependencies]
proptest = "1.4"
tokio-test = "0.4"
tempfile = { workspace = true }
