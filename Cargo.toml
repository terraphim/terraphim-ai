
[workspace]
resolver = "2"
members = ["crates/*", "terraphim_server", "terraphim_firecracker", "terraphim_ai_nodejs"]
# Note: terraphim_usage and terraphim_ccusage are new crates in crates/*
exclude = [
    # terraphim_core / config-persistence / service / agents / kg-agents
    # crates were extracted to standalone polyrepos during the #1910
    # decomposition and are consumed from the `terraphim` registry.
    #
    # terraphim_orchestrator was also extracted to terraphim-agents in #1910 and
    # has been fully removed from this repo (Gitea #3090); see
    # crates/RELOCATED.md. The deployed binary is built from
    # /home/alex/projects/terraphim/terraphim-agents (AGENTS.md rule #3).
    #
    # Empty / residual directories left after polyrepo extraction. They no
    # longer contain a top-level Cargo.toml and must be excluded so `crates/*`
    # does not match them (#2260).
    # Orphaned eval directory: Cargo.toml never merged into main, only tests/ subdir remains.
    # Removed by #3090
    "crates/terraphim_orchestrator",
    "crates/terraphim_eval",
    "crates/terraphim_agent",
    "crates/terraphim_agent_evolution",
    "crates/terraphim_automata",
    "crates/terraphim_cli",
    "crates/terraphim_multi_agent",
    "crates/terraphim_service",
    "crates/terraphim_settings",
    # Experimental crates
    "crates/terraphim_agent_application",
    "crates/terraphim_truthforge",
    # Python bindings (need `maturin develop`)
    "crates/terraphim_automata_py",
    "crates/terraphim_rolegraph_py",
    # Desktop built separately via Tauri CLI
    "desktop/src-tauri",
    # Planned future use, not needed for workspace builds
    "crates/terraphim_build_args",
    # Unused haystack providers (kept for future integration)
    "crates/haystack_atlassian",
    "crates/haystack_discourse",
    # Superseded by terraphim_agent
    "crates/terraphim_repl",
    # Symphony orchestrator (build separately: cd crates/terraphim_symphony && cargo build)
    "crates/terraphim_symphony",
    # Firecracker-based crates (fcctl-core is optional and commented out;
    # crate publishes to crates.io without firecracker feature)
    # "crates/terraphim_rlm",
    # Host-only runners (omitted from Docker build context)
    # "crates/terraphim_github_runner",  -- re-added to workspace for CI testing (#2953)
    "crates/terraphim_github_runner_server",
    # "crates/terraphim_gitea_runner",  -- re-added to workspace for CI testing (#3097)
]
default-members = ["terraphim_server"]

[workspace.package]
version = "1.22.0"
edition = "2024"
rust-version = "1.91"
authors = ["Terraphim Team <team@terraphim.ai>"]
documentation = "https://terraphim.ai"
homepage = "https://terraphim.ai"
repository = "https://github.com/terraphim/terraphim-ai"
license = "Apache-2.0"
readme = "README.md"

[workspace.dependencies]
# OpenRouter AI integration dependencies
tokio = { version = "1.0", features = ["full"] }
# Kernel-held cross-process lease locks (flock) for singleton agents (#3295).
# fs4 0.13.x returns Ok(false) on contention from try_lock_exclusive; it
# replaces fs2 in the shared lease primitive (no stealing, no unlinking).
fs4 = "0.13.1"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
reqwest-middleware = { version = "0.4" }
reqwest-retry = { version = "0.7" }

# Direct HTTP LLM client approach (removed rig-core)
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.21", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
async-trait = "0.1"
thiserror = "1.0"
anyhow = "1.0"
log = "0.4"
tracing = "0.1"
tempfile = "3.27"
# Shared kernel-held cross-process lease primitive (flock) used by both
# terraphim_orchestrator and terraphim_merge_coordinator (#3295).
# Path workspace member so the lockfile crate can live under crates/*
# without breaking the `workspace = true` reference in dependents.
terraphim_lockfile = { path = "crates/terraphim_lockfile" }

# Security: Force rustls 0.23+ to fix RUSTSEC-2026-0049
rustls = { version = "0.23", default-features = false }
# Security: Force rustls-webpki 0.103.12+ to fix RUSTSEC-2026-0049, 0098, 0099
rustls-webpki = "0.103.12"

# LLM Router integration

# terraphim-core types (provider convention: `provider: String`, mirrors `terraphim_types::llm_usage`)
terraphim_types = { version = "1.21.0", registry = "terraphim" }

[patch.crates-io]
# Unify crates.io copies onto Gitea 1.21.0 (borrowed Thesaurus). 1.20.4 is yanked
# on the terraphim registry.
terraphim_types = { version = "1.21.0", registry = "terraphim" }
terraphim_automata = { version = "1.21.0", registry = "terraphim" }
terraphim_rolegraph = { version = "1.20.2", registry = "terraphim" }
# crates.io file_search 1.20.3 still passes owned Thesaurus into automata 1.21.0.
terraphim_file_search = { version = "1.21.0", registry = "terraphim" }
# Gitea middleware 1.21.0 uses file_search 1.21.0 and a single ConfigState.
terraphim_middleware = { version = "1.21.0", registry = "terraphim" }
# Unify leftover crates.io config/persistence copies onto Gitea 1.20.2
# with an exact-version pin so cargo cannot pick a different crates.io
# release (e.g. 1.20.4) for transitive deps like terraphim_command_runtime.
terraphim_config = { version = "=1.20.2", registry = "terraphim" }
terraphim_persistence = { version = "=1.20.2", registry = "terraphim" }
# crates.io hooks 1.20.4 still passes owned Thesaurus.clone() into
# terraphim_automata 1.21.0 (which now takes &Thesaurus). Gitea
# 1.21.0 borrows &self.thesaurus so the family compiles together.
terraphim_hooks = { version = "=1.21.13", registry = "terraphim" }
# crates.io orchestrator 1.20.3 still passes owned Thesaurus into automata
# 1.21.0; the Gitea 1.21.0 publish borrows &self.thesaurus and uses the
# borrowed ConfigState/Role types so it can build alongside the rest of
# the 1.21.x family.
terraphim_orchestrator = { version = "1.21.0", registry = "terraphim" }
# crates.io agent 1.20.4 still passes owned Thesaurus into automata 1.21.0;
# Gitea 1.21.3 borrows &self.thesaurus, ships terraphim_mcp_search 0.1.3
# (which now takes &Thesaurus for find_matches), pulls terraphim_tracker
# 1.20.2 from Gitea (matching what terraphim_orchestrator 1.21.0 was
# built against), and uses the borrowed ConfigState/Role types so the
# agent builds against the rest of the 1.21.x family.
terraphim_agent = { version = "1.21.3", registry = "terraphim" }
# 1.21.1 takes &Thesaurus, pins config/middleware to Gitea, and restores
# pub(crate) enhance_descriptions_with_ai for the openrouter feature.
terraphim_service = { version = "1.21.1", registry = "terraphim" }
# 1.21.1 fixes aider-connector missing-dep bug present in crates.io 1.21.0.
# terraphim_sessions is a member of this workspace, so it always resolves
# locally and a crates-io patch is unused. Drop the patch entry.
# genai patch temporarily disabled to test crates.io 0.6.0 compatibility for v1.20.0 publish chain.
# genai = { git = "https://github.com/terraphim/rust-genai.git", branch = "merge-upstream-20251103" }
self_update = { git = "https://github.com/AlexMikhalev/self_update.git", branch = "update-zipsign-api-v0.2" }
# Security: Patch rustls-webpki to fix RUSTSEC-2026-0049 (CRL bypass), 0098, 0099 (name constraints)
# Using git source to force version override
rustls-webpki = { git = "https://github.com/rustls/webpki.git", tag = "v/0.103.12" }

[profile.release]
panic = "unwind"
lto = false
codegen-units = 1
opt-level = 3

[profile.release-lto]
inherits = "release"
lto = true
codegen-units = 1
opt-level = 3
panic = "abort"

# CI-optimized profiles for faster builds with less disk usage
[profile.ci]
inherits = "dev"
incremental = false
codegen-units = 16
split-debuginfo = "off"
debug = false
strip = true

[profile.ci-release]
inherits = "release"
lto = "thin"
codegen-units = 8
strip = "symbols"
