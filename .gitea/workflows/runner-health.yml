name: runner_health
on:
  schedule:
    # Every 15 minutes -- the fact that this job executes at all proves the
    # native runner is online.  External liveness alerting (healthchecks.io
    # ping + Gitea runner-count check) is performed by a host-side systemd
    # timer (~/.config/systemd/user/runner-health-ping.timer) that does not
    # pass through the sandbox allowlist.  See scripts/runner-health-ping.sh.
    - cron: '*/15 * * * *'
  workflow_dispatch:
jobs:
  heartbeat:
    runs-on: terraphim-native
    timeout-minutes: 3
    steps:
      - name: runner-alive
        run: echo "runner ok at $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
