name: native-ci
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: terraphim-native
    steps:
      # CARGO_HTTP_TIMEOUT=600 (10 min) + --offline makes cargo run purely
      # against the cache. The image (rust-ci.ext4) has the registry cache
      # pre-populated via the Dockerfile's `cargo fetch --locked` step.
      # Without --offline, cargo refreshes the crates.io index even with
      # --locked, which fails on the FC VM's TAP-bridge DNS (observed
      # 'Could not resolve host: index.crates.io' on commit ee04ffcc7).
      # --offline forces cargo to use the on-disk cache only.
      - run: CARGO_HTTP_TIMEOUT=600 cargo fmt --all -- --check
      - run: CARGO_HTTP_TIMEOUT=600 cargo clippy --workspace --offline --all-targets -- -D warnings
      - run: CARGO_HTTP_TIMEOUT=600 cargo build --workspace --offline
      - run: CARGO_HTTP_TIMEOUT=600 cargo test --workspace --offline --lib --no-fail-fast
