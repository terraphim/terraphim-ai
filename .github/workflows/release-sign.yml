# Sign Release Binaries
#
# This workflow verifies coordinator-signed release artifacts. Signing and
# upload happen before approval inside release-coordinator.yml; this workflow
# is deliberately read-only so it cannot become a second release publisher.
#
# Prerequisites:
# - ZIPSIGN_PRIVATE_KEY secret must be set in GitHub repository settings
# - The private key should be the Ed25519 private key generated via
#   scripts/generate-zipsign-keypair.sh
#
# Security:
# - Private key is stored as a GitHub secret (never in code)
# - Signing happens in a clean GitHub Actions environment
# - Release assets are never mutated or uploaded here

name: Verify Release Signatures

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  sign:
    name: Verify Release Artifacts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install zipsign
        run: |
          cargo install zipsign@0.2.1 --locked
          zipsign --version

      - name: Download release artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          echo "Release tag: $RELEASE_TAG"

          # Create directory for artifacts
          mkdir -p artifacts

          # Download all assets from the release
          gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' | \
            while read -r asset_name; do
              # Remove quotes from asset name
              asset_name=$(echo "$asset_name" | tr -d '"')

              # zipsign supports gzipped tar and zip containers.
              if [[ "$asset_name" =~ \.(tar\.gz|zip)$ ]]; then
                echo "Downloading: $asset_name"
                gh release download "$RELEASE_TAG" --pattern "$asset_name" --dir artifacts
              fi
            done

          # List downloaded artifacts
          echo "Downloaded artifacts:"
          ls -lh artifacts/

      - name: Verify artifacts exist
        run: |
          if [ -z "$(ls -A artifacts/)" ]; then
            echo "No artifacts found to sign!"
            exit 1
          fi

          # Count archives
          ARCHIVE_COUNT=$(find artifacts/ -type f \( -name "*.tar.gz" -o -name "*.zip" \) | wc -l)
          echo "Found $ARCHIVE_COUNT archive(s) to sign"

          if [ "$ARCHIVE_COUNT" -eq 0 ]; then
            echo "No tar.gz or zip archives found"
            exit 1
          fi

      - name: Derive verifying key from signing private key
        env:
          ZIPSIGN_PRIVATE_KEY: ${{ secrets.ZIPSIGN_PRIVATE_KEY }}
        run: |
          if [ -z "$ZIPSIGN_PRIVATE_KEY" ]; then
            echo "Error: ZIPSIGN_PRIVATE_KEY secret not set"
            echo "Please set the private key as a GitHub secret"
            exit 1
          fi

          PRIVATE_KEY_FILE="$RUNNER_TEMP/zipsign-private.key"
          VERIFYING_KEY_FILE="$RUNNER_TEMP/zipsign-verifying.key"
          umask 077
          printf '%s' "$ZIPSIGN_PRIVATE_KEY" > "$PRIVATE_KEY_FILE"

          # `zipsign verify` takes a *verifying* (public) key, not the
          # private key -- extract it once so both the "already signed"
          # check below and the standalone verification step use the
          # correct key type. (Passing the private key file straight to
          # `zipsign verify` always fails: "Cannot decompress Edwards
          # point" -- it is not a valid verifying key.)
          zipsign gen-key --extract -f "$PRIVATE_KEY_FILE" "$VERIFYING_KEY_FILE"

          {
            echo "PRIVATE_KEY_FILE=$PRIVATE_KEY_FILE"
            echo "VERIFYING_KEY_FILE=$VERIFYING_KEY_FILE"
          } >> "$GITHUB_ENV"

      - name: Verify signatures
        run: |
          set -euo pipefail
          FAILED_COUNT=0
          for archive in artifacts/*.{tar.gz,zip}; do
            if [ -f "$archive" ]; then
              echo "Verifying: $(basename "$archive")"
              subcommand=tar
              [[ "$archive" == *.zip ]] && subcommand=zip
              if zipsign verify "$subcommand" "$archive" "$VERIFYING_KEY_FILE"; then
                echo "  ✓ Signature valid"
              else
                echo "  ✗ Signature invalid"
                FAILED_COUNT=$((FAILED_COUNT + 1))
              fi
            fi
          done

          if [ $FAILED_COUNT -gt 0 ]; then
            echo "Error: $FAILED_COUNT signature(s) failed verification"
            exit 1
          fi

          echo "All signatures verified successfully"

      - name: Generate signature report
        if: always()
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          SERVER_URL: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          {
            echo "# Signature Verification Report"
            echo ""
            echo "**Release**: $RELEASE_TAG"
            echo "**Date**: $(date -u +"%Y-%m-%d %H:%M:%S UTC")"
            echo "**Workflow Run**: $SERVER_URL/$REPOSITORY/actions/runs/$RUN_ID"
            echo ""
            echo "## Signed Artifacts"
            echo ""
            echo '```'
            ls -lh artifacts/
            echo '```'
          } > signature-report.md

          cat signature-report.md

      - name: Upload signature report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: signature-report
          path: signature-report.md
          retention-days: 90

  summary:
    name: Generate Summary
    runs-on: ubuntu-latest
    needs: sign
    if: always()

    steps:
      - name: Download signature report
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: signature-report
          path: .

      - name: Add job summary
        run: |
          if [ -f signature-report.md ]; then
            cat signature-report.md >> "$GITHUB_STEP_SUMMARY"
          fi
