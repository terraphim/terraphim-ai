name: Publish Node.js Package to npm

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (semantic version)'
        required: true
        type: string
      dry_run:
        description: 'Run in dry-run mode only'
        required: false
        type: boolean
        default: true
      tag:
        description: 'npm tag (latest, beta, next, etc.)'
        required: false
        type: string
        default: 'latest'
  push:
    tags:
      # Monorepo server releases use bare v* tags; npm publishes on nodejs-v* only.
      - 'nodejs-v*'

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  validate:
    name: Validate Package
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    defaults:
      run:
        working-directory: terraphim_ai_nodejs
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'
          cache-dependency-path: terraphim_ai_nodejs/yarn.lock

      - name: Install dependencies
        run: npm install --omit=optional

      - name: Check package.json validity
        run: |
          node -e "const pkg = require('./package.json'); console.log('Package name:', pkg.name); console.log('Version:', pkg.version);"

      - name: Test package preparation
        run: npm run test:packaging

      - name: Resolve version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          VERSION="$INPUT_VERSION"
          if [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF#refs/tags/nodejs-v}"
          fi
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid version format: $VERSION"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version to publish: $VERSION"

  build:
    name: Build Multi-Platform Binaries
    runs-on: ${{ matrix.settings.host }}
    needs: validate
    defaults:
      run:
        working-directory: terraphim_ai_nodejs
    strategy:
      fail-fast: false
      matrix:
        settings:
          - host: macos-latest
            target: x86_64-apple-darwin
            build: yarn build --target x86_64-apple-darwin
          - host: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            build: yarn build --target x86_64-unknown-linux-gnu
          - host: windows-latest
            target: x86_64-pc-windows-msvc
            build: yarn build --target x86_64-pc-windows-msvc
          - host: macos-latest
            target: aarch64-apple-darwin
            build: yarn build --target aarch64-apple-darwin
          - host: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            cross: true
            build: yarn build --target aarch64-unknown-linux-gnu
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        if: ${{ !matrix.settings.cross }}
        with:
          node-version: '20'
          cache: 'yarn'
          cache-dependency-path: terraphim_ai_nodejs/yarn.lock

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        if: ${{ !matrix.settings.cross }}
        with:
          # Matches rust-toolchain.toml, which is what the build actually uses.
          toolchain: '1.96'
          targets: ${{ matrix.settings.target }}

      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            .cargo-cache
            terraphim_ai_nodejs/target/
          key: ${{ matrix.settings.target }}-cargo-${{ matrix.settings.host }}

      - name: Install dependencies
        if: ${{ !matrix.settings.cross }}
        run: npm install --omit=optional

      - name: Build cross-compilation docker image
        if: ${{ matrix.settings.cross }}
        working-directory: ${{ github.workspace }}
        run: |
          docker build -t terraphim-nodejs-builder -f .github/docker/nodejs-builder.Dockerfile .github/docker/

      - name: Build in docker (cross-compilation)
        if: ${{ matrix.settings.cross }}
        working-directory: ${{ github.workspace }}
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/build \
            -w /build/terraphim_ai_nodejs \
            -e CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc \
            -e CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc \
            -e CXX_aarch64_unknown_linux_gnu=aarch64-linux-gnu-g++ \
            terraphim-nodejs-builder \
            bash -c "rustup target add ${{ matrix.settings.target }} && npm install --omit=optional && ${{ matrix.settings.build }}"

      - name: Build
        run: ${{ matrix.settings.build }}
        if: ${{ !matrix.settings.cross }}

      - name: Collect built binaries
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist-bindings

          NODE_COUNT=0
          while IFS= read -r file; do
            cp "$file" dist-bindings/
            NODE_COUNT=$((NODE_COUNT + 1))
          done < <(find . -type f -name "*.node")

          if [[ "$NODE_COUNT" -eq 0 ]]; then
            echo "No .node binaries were produced"
            exit 1
          fi

          echo "Collected binaries:"
          ls -la dist-bindings/

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: bindings-${{ matrix.settings.target }}
          path: terraphim_ai_nodejs/dist-bindings
          if-no-files-found: error

  test-universal:
    name: Test Universal Binaries
    runs-on: ${{ matrix.settings.host }}
    needs: build
    defaults:
      run:
        working-directory: terraphim_ai_nodejs
    strategy:
      fail-fast: false
      matrix:
        settings:
          - host: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - host: windows-latest
            target: x86_64-pc-windows-msvc
        node:
          - '18'
          - '20'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: 'yarn'
          cache-dependency-path: terraphim_ai_nodejs/yarn.lock

      - name: Install dependencies
        run: npm install --omit=optional

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: bindings-${{ matrix.settings.target }}
          path: terraphim_ai_nodejs

      - name: Test package functionality with Node.js
        run: |
          node test_autocomplete.js
          node test_knowledge_graph.js

      - name: Test package functionality with Bun
        run: |
          bun test_autocomplete.js
          bun test_knowledge_graph.js

  test-macos:
    name: Test macOS Universal Binary
    runs-on: ${{ matrix.host }}
    needs: create-universal-macos
    defaults:
      run:
        working-directory: terraphim_ai_nodejs
    strategy:
      fail-fast: false
      matrix:
        # Test on both Intel and ARM macOS runners
        host:
          - macos-15-intel
          - macos-latest
        node:
          - '18'
          - '20'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: 'yarn'
          cache-dependency-path: terraphim_ai_nodejs/yarn.lock

      - name: Install dependencies
        run: npm install --omit=optional

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Download universal binary
        uses: actions/download-artifact@v4
        with:
          name: bindings-universal-apple-darwin
          path: terraphim_ai_nodejs

      - name: Rename universal binary for NAPI
        run: |
          ls -la ./*.node || echo "No .node files found"
          # Rename to what index.js expects
          mv terraphim_ai_nodejs.darwin-universal.node terraphim_ai_nodejs.darwin-universal.node 2>/dev/null || true
          ls -la ./*.node

      - name: Test package functionality with Node.js
        run: |
          node test_autocomplete.js
          node test_knowledge_graph.js

      - name: Test package functionality with Bun
        run: |
          bun test_autocomplete.js
          bun test_knowledge_graph.js

  create-universal-macos:
    name: Create Universal macOS Binary
    runs-on: macos-latest
    needs: build
    defaults:
      run:
        working-directory: terraphim_ai_nodejs
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'
          cache-dependency-path: terraphim_ai_nodejs/yarn.lock

      - name: Install dependencies
        run: npm install --omit=optional

      - name: Download macOS x64 artifact
        uses: actions/download-artifact@v4
        with:
          name: bindings-x86_64-apple-darwin
          path: terraphim_ai_nodejs/artifacts

      - name: Download macOS arm64 artifact
        uses: actions/download-artifact@v4
        with:
          name: bindings-aarch64-apple-darwin
          path: terraphim_ai_nodejs/artifacts

      - name: Create universal binary
        run: |
          cd artifacts
          ls -la
          # NAPI-RS generates filenames with darwin-x64/darwin-arm64 naming convention
          lipo -create terraphim_ai_nodejs.darwin-x64.node terraphim_ai_nodejs.darwin-arm64.node -output terraphim_ai_nodejs.darwin-universal.node
          ls -la ./*.node

      - name: Upload universal binary
        uses: actions/upload-artifact@v5
        with:
          name: bindings-universal-apple-darwin
          path: terraphim_ai_nodejs/artifacts/terraphim_ai_nodejs.darwin-universal.node
          if-no-files-found: error

  verify-package:
    name: Install Packed Tarballs (${{ matrix.settings.platform }})
    runs-on: ${{ matrix.settings.host }}
    needs: [validate, build]
    defaults:
      run:
        shell: bash
        working-directory: terraphim_ai_nodejs
    strategy:
      fail-fast: false
      matrix:
        settings:
          - host: macos-latest
            platform: darwin-arm64
          - host: macos-15-intel
            platform: darwin-x64
          - host: ubuntu-latest
            platform: linux-x64-gnu
          - host: ubuntu-24.04-arm
            platform: linux-arm64-gnu
          - host: windows-latest
            platform: win32-x64-msvc
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare packages
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: node scripts/prepare-npm-packages.mjs --version "$VERSION" --artifacts ../artifacts

      - name: Install the tarballs into a clean project and run a search
        env:
          PLATFORM: ${{ matrix.settings.platform }}
        run: |
          set -euo pipefail
          mkdir -p ../.pack-out ../.consumer
          (cd "npm/$PLATFORM" && npm pack --ignore-scripts --pack-destination ../../../.pack-out)
          npm pack --ignore-scripts --pack-destination ../.pack-out
          cd ../.consumer
          npm init -y >/dev/null
          npm install --no-audit --no-fund --no-workspaces ../.pack-out/*.tgz
          node ../terraphim_ai_nodejs/scripts/smoke-test-installed.cjs

  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    needs: [validate, test-universal, test-macos, verify-package]
    defaults:
      run:
        working-directory: terraphim_ai_nodejs
    env:
      DRY_RUN: ${{ inputs.dry_run }}
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
          scope: '@terraphim'

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare packages
        run: node scripts/prepare-npm-packages.mjs --version "$VERSION" --artifacts ../artifacts

      - name: Check npm credentials
        run: npm whoami

      - name: Determine npm tag
        id: strategy
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          NPM_TAG="${INPUT_TAG:-latest}"
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            case "$VERSION" in
              *-beta*) NPM_TAG="beta" ;;
              *-alpha*) NPM_TAG="alpha" ;;
              *-rc*) NPM_TAG="rc" ;;
              *) NPM_TAG="latest" ;;
            esac
          fi
          echo "npm_tag=$NPM_TAG" >> "$GITHUB_OUTPUT"

      - name: Publish platform packages, then the main package
        env:
          NPM_TAG: ${{ steps.strategy.outputs.npm_tag }}
        run: |
          set -euo pipefail
          FLAGS=(--ignore-scripts --access public --tag "$NPM_TAG")
          if [[ "$DRY_RUN" == "true" ]]; then
            FLAGS+=(--dry-run)
          fi

          publish() {
            local directory="$1" name
            name=$(node -p "require('./$directory/package.json').name")
            if [[ "$DRY_RUN" != "true" ]] && npm view "$name@$VERSION" version >/dev/null 2>&1; then
              echo "$name@$VERSION is already published"
              return 0
            fi
            (cd "$directory" && npm publish "${FLAGS[@]}")
          }

          # Platform packages go first so the main package never points at a missing one.
          for binary in npm/*/*.node; do
            publish "$(dirname "$binary")"
          done
          publish .

      - name: Install from the registry and run a search
        if: ${{ inputs.dry_run != true }}
        run: |
          set -euo pipefail
          mkdir -p ../.registry-consumer
          cd ../.registry-consumer
          npm init -y >/dev/null
          for attempt in 1 2 3 4 5 6; do
            if npm install --no-audit --no-fund --no-workspaces "@terraphim/autocomplete@$VERSION"; then
              break
            fi
            if [[ "$attempt" == "6" ]]; then
              echo "@terraphim/autocomplete@$VERSION did not become installable"
              exit 1
            fi
            sleep 30
          done
          node ../terraphim_ai_nodejs/scripts/smoke-test-installed.cjs

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/nodejs-') && inputs.dry_run != true
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          name: "@terraphim/autocomplete ${{ github.ref_name }}"
          token: ${{ secrets.GITHUB_TOKEN }}
          body: |
            ```bash
            npm install @terraphim/autocomplete@${{ needs.validate.outputs.version }}
            ```
          draft: false
          prerelease: ${{ steps.strategy.outputs.npm_tag != 'latest' }}
